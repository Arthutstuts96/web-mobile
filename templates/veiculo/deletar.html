<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Exclusão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow-sm border-0">
                    <div class="card-body text-center">
                        <h4 class="card-title text-danger mb-3">Tem certeza que deseja deletar este veículo?</h4>
                        <p class="card-text">Essa ação é irreversível.</p>

                        <form action="/veiculo/deletar/{{object.id}}/" method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger px-4">Deletar</button>
                            <a href="javascript:history.back()" class="btn btn-secondary ms-2">Cancelar</a>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
